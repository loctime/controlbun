<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Mapeos — ControlBun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #EDE8DF;
      --surface: #FAF8F4;
      --surface-hover: #F2EFE8;
      --border: #D8D2C6;
      --border-strong: #B8B0A0;
      --text: #1C2228;
      --text-2: #4A5058;
      --text-3: #8A9099;
      --accent: #C05E2A;
      --accent-h: #A34E22;
      --accent-s: #FDF0E8;
      --danger: #B83228;
      --danger-h: #922820;
      --danger-s: #FFF0EE;
      --shadow-sm: 0 1px 3px rgba(28,34,40,.08);
      --shadow-md: 0 4px 16px rgba(28,34,40,.10);
      --shadow-lg: 0 16px 48px rgba(28,34,40,.16);
      --r: 10px;
      --rl: 16px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Header ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--text);
      border-bottom: 1px solid rgba(255,255,255,.08);
      padding: 0 32px;
      box-shadow: 0 2px 12px rgba(28,34,40,.18);
    }
    .h-inner {
      max-width: 1160px; margin: 0 auto;
      height: 56px; display: flex; align-items: center; justify-content: space-between;
    }
    .h-brand { display: flex; align-items: center; gap: 12px; }
    .h-logo { font-family: 'Crimson Pro', serif; font-size: 22px; font-weight: 600; letter-spacing: -.02em; color: #fff; }
    .h-logo em { color: var(--accent); font-style: normal; }
    .h-divider { width:1px; height:18px; background:rgba(255,255,255,.18); }
    .h-tag {
      font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em;
      color: rgba(255,255,255,.5); padding: 0;
    }
    .h-user { display: flex; align-items: center; gap: 9px; font-size: 13px; color: rgba(255,255,255,.75); }
    .h-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600;
    }

    /* ── Main ── */
    main { max-width: 1160px; margin: 0 auto; padding: 32px 32px; }

    /* ── Page header ── */
    .ph { margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .ph-left { display:flex; align-items:baseline; gap:12px; }
    .ph-left h1 { font-family: 'Crimson Pro', serif; font-size: 32px; font-weight: 600; letter-spacing: -.02em; line-height: 1; }
    .ph-left p { font-size: 13px; color: var(--text-3); }
    .ph-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .count {
      display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500;
      color: var(--text-2); background: var(--surface); border: 1px solid var(--border);
      padding: 5px 14px; border-radius: 100px;
    }
    .count strong { color: var(--text); }

    /* ── Toolbar ── */
    .toolbar {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 16px; flex-wrap: wrap;
    }
    .toolbar-search {
      flex: 1; min-width: 200px; max-width: 320px;
      padding: 7px 12px 7px 34px;
      font-family: 'DM Sans', sans-serif; font-size: 13.5px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); outline: none; transition: border-color .15s;
      position: relative;
    }
    .toolbar-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(192,94,42,.1); }
    .search-wrap { position: relative; flex:1; min-width:200px; max-width:320px; }
    .search-wrap svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--text-3); pointer-events:none; }
    .view-toggle { display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
    .view-btn {
      padding: 6px 10px; background: var(--surface); border: none; cursor: pointer;
      color: var(--text-3); transition: all .15s; display:flex; align-items:center;
    }
    .view-btn svg { width:15px; height:15px; }
    .view-btn:hover { background: var(--surface-hover); color: var(--text-2); }
    .view-btn.active { background: var(--text); color: #fff; }
    .view-btn + .view-btn { border-left: 1px solid var(--border); }

    /* ── Table ── */
    .table-wrap {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--rl); overflow: hidden; box-shadow: var(--shadow-sm);
    }
    .mapeos-table { width: 100%; border-collapse: collapse; }
    .mapeos-table thead tr {
      background: var(--bg);
      border-bottom: 2px solid var(--border);
    }
    .mapeos-table th {
      padding: 10px 14px; text-align: left;
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .07em; color: var(--text-3); white-space: nowrap;
    }
    .mapeos-table th.th-center { text-align: center; }
    .mapeos-table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .12s;
      animation: rowIn .3s ease both;
    }
    @keyframes rowIn { from { opacity:0; transform:translateX(-4px); } to { opacity:1; transform:none; } }
    .mapeos-table tbody tr:last-child { border-bottom: none; }
    .mapeos-table tbody tr:hover { background: var(--surface-hover); }
    .mapeos-table td { padding: 10px 14px; vertical-align: middle; }
    .td-thumbs {
      padding: 8px 12px 8px 16px; white-space: nowrap;
      width: 1px; /* shrink to content */
    }
    .td-thumbs .td-thumb-inner { display: inline-block; margin-right: 4px; }
    .td-thumbs .td-thumb-inner:last-child { margin-right: 0; }
    .td-thumb-inner {
      width: 40px; height: 54px; border-radius: 5px; overflow: hidden;
      border: 1px solid var(--border); cursor: zoom-in; flex-shrink:0;
      transition: transform .15s; vertical-align: middle;
    }
    .td-thumb-inner:hover { transform: scale(1.08); z-index:1; position:relative; }
    .td-thumb-inner img { width:100%; height:100%; object-fit:cover; display:block; }
    .td-nombre { font-family:'Crimson Pro',serif; font-size:16px; font-weight:600; letter-spacing:-.01em; }
    .td-meta { font-size:12px; color:var(--text-3); margin-top:1px; }
    .td-pages { font-size:13px; color:var(--text-2); text-align:center; }
    .td-actions { white-space:nowrap; text-align:right; padding-right:16px; }
    .td-actions .btn + .btn { margin-left:4px; }

    /* ── Grid ── */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }

    /* ── Card ── */
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--rl);
      overflow: hidden; box-shadow: var(--shadow-sm);
      transition: box-shadow .2s, transform .2s;
      animation: cardIn .4s ease both;
    }
    .card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    @keyframes cardIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

    .card-imgs {
      display: flex; background: #E5DFCF;
      border-bottom: 1px solid var(--border); min-height: 180px; overflow: hidden;
    }
    .card-img {
      flex: 1; object-fit: cover; cursor: zoom-in;
      transition: transform .3s; min-width: 0; display: block;
    }
    .card-img:hover { transform: scale(1.04); }
    .card-img + .card-img { border-left: 1px solid var(--border); }
    .card-no-img { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-3); font-size: 13px; }

    .card-body { padding: 14px 16px; }
    .card-name { font-family: 'Crimson Pro', serif; font-size: 17px; font-weight: 600; letter-spacing: -.01em; line-height: 1.3; margin-bottom: 3px; }
    .card-meta { font-size: 12px; color: var(--text-3); margin-bottom: 12px; }
    .card-actions { display: flex; gap: 7px; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 5px;
      font-family: 'DM Sans', sans-serif; font-size: 12.5px; font-weight: 500;
      padding: 6px 12px; border-radius: 7px; border: 1px solid transparent;
      cursor: pointer; transition: all .15s; white-space: nowrap; line-height: 1;
    }
    .btn svg { width:14px; height:14px; flex-shrink:0; }
    .btn-ghost { background: var(--surface); color: var(--text-2); border-color: var(--border); }
    .btn-ghost:hover { background: var(--surface-hover); border-color: var(--border-strong); color: var(--text); }
    .btn-danger { background: var(--danger-s); color: var(--danger); border-color: rgba(184,50,40,.18); }
    .btn-danger:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
    .btn-accent { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-accent:hover { background: var(--accent-h); border-color: var(--accent-h); }
    .btn-dark { background: var(--text); color: var(--bg); border-color: var(--text); }
    .btn-dark:hover { background: #2D3640; }
    .btn:disabled { opacity:.45; cursor:not-allowed; pointer-events:none; }
    .btn-sm { font-size: 11.5px; padding: 4px 9px; }
    .btn-lg { font-size: 14px; padding: 9px 18px; }

    /* ── Empty / loading ── */
    .empty { grid-column:1/-1; text-align:center; padding:72px 24px; }
    .empty-icon { font-size:56px; display:block; margin-bottom:16px; opacity:.3; }
    .empty h2 { font-family:'Crimson Pro',serif; font-size:26px; font-weight:400; color:var(--text-2); margin-bottom:8px; }
    .empty p { font-size:13px; color:var(--text-3); }

    .loading { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:280px; gap:14px; color:var(--text-3); }
    .spin { width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite; }
    .spin-sm { width:16px;height:16px;border-width:2px; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── Modal ── */
    .overlay {
      position:fixed;inset:0;background:rgba(28,34,40,.52);
      backdrop-filter:blur(4px);z-index:200;
      display:flex;align-items:center;justify-content:center;padding:20px;
      animation:fadeIn .18s ease;
    }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }

    .modal {
      background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);
      box-shadow:var(--shadow-lg);width:100%;max-width:520px;
      max-height:88vh;display:flex;flex-direction:column;
      animation:modalIn .22s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes modalIn { from{opacity:0;transform:scale(.93) translateY(8px)} to{opacity:1;transform:none} }

    .modal-hd {
      padding:18px 22px;border-bottom:1px solid var(--border);
      display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-shrink:0;
    }
    .modal-title { font-family:'Crimson Pro',serif; font-size:20px; font-weight:600; letter-spacing:-.01em; line-height:1.2; }
    .modal-sub { font-size:12.5px; color:var(--text-3); margin-top:3px; }
    .modal-x {
      width:26px;height:26px;border-radius:6px;border:none;background:none;cursor:pointer;
      display:flex;align-items:center;justify-content:center;color:var(--text-3);flex-shrink:0;
      transition:all .15s;
    }
    .modal-x:hover { background:var(--border); color:var(--text); }

    .modal-body { padding:22px;overflow-y:auto;flex:1; }
    .modal-ft {
      padding:14px 22px;border-top:1px solid var(--border);
      display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;background:var(--surface);
    }

    /* ── Upload zone ── */
    .drop-zone {
      border:2px dashed var(--border-strong);border-radius:var(--r);
      padding:36px 20px;text-align:center;cursor:pointer;
      transition:all .2s;background:var(--bg);position:relative;
    }
    .drop-zone:hover, .drop-zone.over { border-color:var(--accent); background:var(--accent-s); }
    .drop-zone input { position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%; }
    .drop-icon { font-size:32px;display:block;margin-bottom:10px; }
    .drop-text { font-size:13.5px;font-weight:500;color:var(--text-2);margin-bottom:3px; }
    .drop-hint { font-size:12px;color:var(--text-3); }

    /* ── Page selector (replace modal) ── */
    .sel-label { font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);margin-bottom:11px; }
    .pages-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:9px; }
    .page-th {
      border:2px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;
      position:relative;transition:all .15s;
    }
    .page-th:hover { border-color:var(--accent); }
    .page-th.sel { border-color:var(--accent);box-shadow:0 0 0 3px rgba(192,94,42,.18); }
    .page-th img { width:100%;display:block;aspect-ratio:3/4;object-fit:cover; }
    .page-num {
      position:absolute;top:5px;left:5px;background:rgba(28,34,40,.72);color:#fff;
      font-size:10.5px;font-weight:600;padding:2px 5px;border-radius:4px;
    }
    .page-check {
      position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;
      background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;
      opacity:0;transition:opacity .15s;
    }
    .page-th.sel .page-check { opacity:1; }

    /* ── Progress ── */
    .prog { text-align:center;padding:28px 0; }
    .prog .spin { margin:0 auto 12px; }
    .prog p { font-size:13px;color:var(--text-3); }

    /* ── PDF loader ── */
    .pdf-loader {
      display:flex;flex-direction:column;align-items:center;gap:20px;
      padding:40px 20px;text-align:center;
    }
    .pdf-loader-spin {
      width:40px;height:40px;
      border:3px solid var(--border);border-top-color:var(--accent);
      border-radius:50%;animation:spin .8s linear infinite;
    }
    .pdf-loader-steps { display:flex;flex-direction:column;gap:8px;min-width:220px; }
    .pdf-step {
      display:flex;align-items:center;gap:10px;
      font-size:13px;color:var(--text-3);
      transition:color .3s;
    }
    .pdf-step.active { color:var(--text); }
    .pdf-step.done { color:var(--text-3); }
    .pdf-step-dot {
      width:8px;height:8px;border-radius:50%;flex-shrink:0;
      background:var(--border);transition:background .3s;
    }
    .pdf-step.active .pdf-step-dot { background:var(--accent);box-shadow:0 0 0 3px rgba(192,94,42,.2); }
    .pdf-step.done .pdf-step-dot { background:var(--border-strong); }

    /* ── Confirm ── */
    .confirm-body { text-align:center;padding:28px 22px; }
    .confirm-icon { font-size:36px;display:block;margin-bottom:14px; }
    .confirm-text { font-size:14px;color:var(--text-2);line-height:1.6; }
    .confirm-name { font-weight:600;color:var(--text); }

    /* ── Lightbox ── */
    .lb {
      position:fixed;inset:0;background:rgba(10,12,16,.94);z-index:300;
      display:flex;align-items:center;justify-content:center;cursor:zoom-out;
      animation:fadeIn .18s ease;
    }
    .lb img { max-width:92vw;max-height:92vh;object-fit:contain;border-radius:4px;box-shadow:0 20px 80px rgba(0,0,0,.6); }

    /* ── Toast ── */
    .toasts { position:fixed;bottom:22px;right:22px;z-index:400;display:flex;flex-direction:column;gap:7px; }
    .toast {
      padding:10px 16px;border-radius:var(--r);font-size:13px;font-weight:500;
      box-shadow:var(--shadow-md);display:flex;align-items:center;gap:7px;max-width:300px;
      animation:toastIn .25s cubic-bezier(.34,1.56,.64,1);
    }
    .toast.ok { background:#1A4032;color:#C4F5DD; }
    .toast.err { background:#4A1810;color:#FFD0CC; }
    @keyframes toastIn { from{opacity:0;transform:translateX(16px)} to{opacity:1;transform:none} }

    /* ── Login ── */
    .login-wrap {
      display:flex;align-items:center;justify-content:center;
      min-height:calc(100vh - 60px);padding:32px 16px;
    }
    .login-card {
      background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);
      box-shadow:var(--shadow-md);width:100%;max-width:380px;padding:40px 36px;
      animation:cardIn .35s ease;
    }
    .login-logo {
      font-family:'Crimson Pro',serif;font-size:28px;font-weight:600;
      letter-spacing:-.02em;margin-bottom:6px;
    }
    .login-logo em { color:var(--accent);font-style:normal; }
    .login-sub { font-size:13px;color:var(--text-3);margin-bottom:28px;line-height:1.5; }
    .login-err {
      background:var(--danger-s);border:1px solid rgba(184,50,40,.2);
      color:var(--danger);font-size:13px;padding:10px 14px;border-radius:8px;margin-bottom:18px;
    }
    .field { margin-bottom:16px; }
    .field-label { display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:5px;letter-spacing:.01em; }
    .field-input {
      width:100%;padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:14px;
      background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);
      outline:none;transition:border-color .15s;
    }
    .field-input:focus { border-color:var(--accent);box-shadow:0 0 0 3px rgba(192,94,42,.12); }
    .login-btn { width:100%;justify-content:center;padding:10px;font-size:14px;margin-top:6px; }

    /* ════════════════════════════════════════════════════════════
       EDITOR VIEW
    ════════════════════════════════════════════════════════════ */

    .editor-wrap {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 60px);
      max-width: 1160px;
      margin: 0 auto;
      padding: 0 32px;
    }

    .editor-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      gap: 12px;
      flex-wrap: wrap;
    }
    .editor-bar-left { display:flex; align-items:center; gap:12px; }
    .editor-title { font-family:'Crimson Pro',serif; font-size:22px; font-weight:600; letter-spacing:-.01em; }
    .editor-bar-right { display:flex; align-items:center; gap:8px; }

    .editor-body {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 0;
    }

    /* Left panel — PDF pages */
    .editor-left {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0 24px;
      padding-right: 20px;
    }

    .editor-upload {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 320px;
    }

    .editor-drop {
      border: 2px dashed var(--border-strong); border-radius: var(--rl);
      padding: 56px 40px; text-align: center; cursor: pointer;
      transition: all .2s; background: var(--surface); position: relative;
      width: 100%; max-width: 480px;
    }
    .editor-drop:hover, .editor-drop.over { border-color:var(--accent); background:var(--accent-s); }
    .editor-drop input { position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%; }
    .editor-drop-icon { font-size:48px;display:block;margin-bottom:14px; }
    .editor-drop-text { font-size:15px;font-weight:500;color:var(--text-2);margin-bottom:4px; }
    .editor-drop-hint { font-size:12.5px;color:var(--text-3); }

    .editor-pages-hd {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom: 14px;
    }
    .editor-pages-label { font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3); }
    .editor-sel-count { font-size:12px; color:var(--text-2); }

    .editor-pages {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .editor-pages-assigned {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-top: 16px;
    }
    .editor-section-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .07em; color: var(--text-3);
      margin-bottom: 8px; margin-top: 20px;
    }

    .ep {
      border: 2.5px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: border-color .15s, box-shadow .15s;
      user-select: none;
    }
    .ep:hover:not(.ep-assigned) { border-color: var(--accent); }
    .ep.ep-sel {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(192,94,42,.2);
    }
    .ep.ep-assigned {
      cursor: default;
      opacity: .72;
    }
    .ep img { width:100%; display:block; aspect-ratio:3/4; object-fit:cover; }

    .ep-num {
      position:absolute;top:5px;left:5px;background:rgba(28,34,40,.72);color:#fff;
      font-size:10px;font-weight:600;padding:2px 5px;border-radius:4px;
    }

    .ep-badge {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 4px 6px;
      font-size: 9.5px; font-weight: 600;
      text-align: center;
      color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .ep-check {
      position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;
      background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;
      opacity:0;transition:opacity .15s;
    }
    .ep.ep-sel .ep-check { opacity:1; }

    .ep-eye {
      position:absolute;bottom:5px;right:5px;width:24px;height:24px;border-radius:6px;
      background:rgba(28,34,40,.62);color:#fff;border:none;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      opacity:0;transition:opacity .15s;backdrop-filter:blur(2px);
    }
    .ep-eye svg { width:13px;height:13px; }
    .ep:hover .ep-eye { opacity:1; }
    .ep.ep-assigned:hover .ep-eye { opacity:1; }

    /* Right panel — Groups sidebar */
    .editor-right {
      width: 300px;
      flex-shrink: 0;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-hd {
      padding: 18px 16px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sidebar-title { font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3); margin-bottom:2px; }
    .sidebar-sub { font-size:12px;color:var(--text-3); }

    .sidebar-groups {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sidebar-empty {
      text-align:center; padding:32px 12px;
      font-size:13px; color:var(--text-3); line-height:1.6;
    }

    .group-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      animation: cardIn .25s ease;
    }

    .group-card-hd {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px 8px;
    }
    .group-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .group-name {
      font-size: 13px; font-weight: 500; line-height: 1.3;
      flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .group-rm {
      width: 20px; height: 20px; border-radius: 5px; border:none; background:none;
      cursor:pointer; display:flex;align-items:center;justify-content:center;
      color:var(--text-3); flex-shrink:0; transition:all .15s;
    }
    .group-rm:hover { background:var(--danger-s); color:var(--danger); }
    .group-rm svg { width:10px;height:10px; }

    .group-thumbs {
      display: flex; gap: 3px; padding: 0 10px 10px; flex-wrap:wrap;
    }
    .group-thumb {
      width: 36px; height: 48px;
      border-radius: 4px; overflow: hidden; border: 1px solid var(--border);
      cursor: zoom-in; position: relative; flex-shrink: 0;
      transition: transform .15s;
    }
    .group-thumb:hover { transform: scale(1.08); z-index:1; }
    .group-thumb img { width:100%;height:100%;object-fit:cover;display:block; }
    .group-pages-count { font-size:11px; color:var(--text-3); padding: 0 12px 10px; }

    .sidebar-ft {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* ── Assign button row ── */
    .assign-bar {
      padding: 14px 0 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ── Req picker modal ── */
    .modal-lg { max-width: 560px; }
    .req-search {
      width: 100%; padding: 9px 12px;
      font-family: 'DM Sans', sans-serif; font-size: 14px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); outline: none; transition: border-color .15s;
      margin-bottom: 12px;
    }
    .req-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(192,94,42,.12); }
    .req-list { display:flex; flex-direction:column; gap:2px; max-height:300px; overflow-y:auto; }
    .req-item {
      padding: 8px 12px; border-radius: 7px; cursor: pointer;
      font-size: 13.5px; transition: background .12s;
      display: flex; align-items: center; gap: 10px;
    }
    .req-item:hover:not(.used) { background: var(--surface-hover); }
    .req-item.used { opacity: .4; cursor: default; pointer-events:none; }
    .req-cb {
      width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid var(--border-strong);
      flex-shrink: 0; display:flex; align-items:center; justify-content:center;
      transition: all .12s; background: var(--bg);
    }
    .req-item.picked .req-cb { background: var(--accent); border-color: var(--accent); }
    .req-item.picked .req-cb svg { display:block; }
    .req-cb svg { display:none; width:10px;height:10px;stroke:#fff;stroke-width:2; }
    .req-label { flex:1; }
    .req-badge { font-size:11px; color:var(--text-3); flex-shrink:0; }
    .req-none { font-size:13px;color:var(--text-3);text-align:center;padding:20px 0; }
    .req-confirm {
      padding: 12px 22px; border-top: 1px solid var(--border);
      display: flex; align-items:center; justify-content:space-between; gap:10px;
      background: var(--surface); flex-shrink:0;
    }
    .req-confirm-label { font-size:12.5px; color:var(--text-3); }

    /* ── Reqs info bar ── */
    .reqs-bar {
      display:inline-flex; align-items:center; gap:8px;
      font-size:12px; color:var(--text-3);
    }
    .reqs-bar strong { color:var(--text-2); }

    /* ── Reqs panel in editor ── */
    .reqs-panel {
      display: flex; align-items: center; gap: 12px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 9px 14px;
    }
    .reqs-panel-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--accent-s); color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .reqs-panel-icon svg { width:16px; height:16px; }
    .reqs-panel-text { flex:1; min-width:0; }
    .reqs-panel-title { font-size: 12.5px; font-weight: 600; color: var(--text); line-height:1.2; }
    .reqs-panel-sub { font-size: 11.5px; color: var(--text-3); margin-top:1px; }

    @media (max-width:900px) {
      .editor-right { width: 240px; }
    }
    @media (max-width:700px) {
      header { padding:0 16px; }
      main { padding:20px 16px; }
      .ph-left h1 { font-size:26px; }
      .grid { grid-template-columns:1fr; }
      .editor-wrap { padding: 0 16px; }
      .editor-body { flex-direction: column; }
      .editor-right { width: 100%; border-left: none; border-top: 1px solid var(--border); height: 260px; }
      .editor-left { padding-right: 0; }
      .td-thumbs { display:none; }
      .toolbar-search { max-width:100%; }
    }
  </style>
</head>
<body>

<header>
  <div class="h-inner">
    <div class="h-brand">
      <span class="h-logo">Control<em>Bun</em></span>
      <span class="h-divider"></span>
      <span class="h-tag">Gestión de mapeos</span>
    </div>
    <div class="h-user" id="hUser" style="display:none">
      <div class="h-avatar" id="hAvatar"></div>
      <span id="hName"></span>
    </div>
  </div>
</header>

<main id="app">
  <div class="loading"><div class="spin"></div><span>Cargando…</span></div>
</main>

<div class="toasts" id="toasts"></div>
<div class="lb" id="lb" style="display:none" onclick="closeLb()"><img id="lbImg" src="" alt=""></div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────────
const GROUP_COLORS = ['#C05E2A','#2D5C8E','#2A7C5A','#7C4A8E','#8E6A2A','#5C2D2D','#2D5C3A','#5C522D'];

// ── State ─────────────────────────────────────────────────────────────────────
let S = {
  user: null, mapeos: [], reqs: [], reqsTimestamp: null,
  viewType: localStorage.getItem('viewType') || 'table',
  searchQuery: '',
};

// Editor state — only active while editor view is open
let E = null;

// ── API ───────────────────────────────────────────────────────────────────────
async function apiFetch(method, path, body) {
  const opts = { method };
  if (body instanceof ArrayBuffer || body instanceof Uint8Array) {
    opts.headers = { 'Content-Type': 'application/octet-stream' };
    opts.body = body;
  } else if (body) {
    opts.headers = { 'Content-Type': 'application/json' };
    opts.body = JSON.stringify(body);
  }
  const r = await fetch(path, opts);
  if (r.status === 401) { renderLogin(); throw new Error('401'); }
  return r;
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg, type='ok') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function pdfLoaderHtml(containerId) {
  return `<div class="pdf-loader" id="${containerId}">
    <div class="pdf-loader-spin"></div>
    <div class="pdf-loader-steps">
      <div class="pdf-step active" id="${containerId}_s1"><span class="pdf-step-dot"></span>Leyendo archivo…</div>
      <div class="pdf-step" id="${containerId}_s2"><span class="pdf-step-dot"></span>Renderizando páginas…</div>
      <div class="pdf-step" id="${containerId}_s3"><span class="pdf-step-dot"></span>Preparando miniaturas…</div>
    </div>
  </div>`;
}

function pdfLoaderStep(containerId, step) {
  for (let i = 1; i <= 3; i++) {
    const el = document.getElementById(`${containerId}_s${i}`);
    if (!el) continue;
    el.className = 'pdf-step' + (i < step ? ' done' : i === step ? ' active' : '');
  }
}

function fmtDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString('es-AR', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}

const IC = {
  trash: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M5.5 4V3a.5.5 0 01.5-.5h4a.5.5 0 01.5.5v1M6.5 7v5M9.5 7v5M3 4l.8 8.4a1 1 0 001 .9h6.4a1 1 0 001-.9L13 4"/></svg>`,
  upload: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 10V2M5 5l3-3 3 3M2 11v1.5a1 1 0 001 1h10a1 1 0 001-1V11"/></svg>`,
  plus: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3v10M3 8h10"/></svg>`,
  back: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3L5 8l5 5"/></svg>`,
  refresh: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 8A5.5 5.5 0 0113.5 8M13.5 8v-3M13.5 8h-3"/></svg>`,
  x: `<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 1l12 12M13 1L1 13"/></svg>`,
  check: `<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="2"><path d="M1.5 5l2.5 2.5 4.5-5"/></svg>`,
  save: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 11v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4a1 1 0 011-1h6l3 3v5zM10 14v-4H6v4M6 3v3h5"/></svg>`,
  eye: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z"/><circle cx="8" cy="8" r="2"/></svg>`,
  grid2: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="6" height="14" rx="1.5"/><rect x="9" y="1" width="6" height="14" rx="1.5"/></svg>`,
  grid4: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>`,
};

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const r = await fetch('/api/me');
    if (!r.ok) { renderLogin(); return; }
    S.user = await r.json();
    showHeader();
    await loadMapeos();
    // Load reqs cache silently in background
    loadReqsCache().catch(() => {});
  } catch { renderLogin(); }
}

function showHeader() {
  document.getElementById('hUser').style.display = 'flex';
  document.getElementById('hName').textContent = S.user.nombre;
  document.getElementById('hAvatar').textContent = S.user.nombre.charAt(0).toUpperCase();
}

async function loadMapeos() {
  const r = await apiFetch('GET', '/api/mapeos');
  S.mapeos = await r.json();
  render();
}

async function loadReqsCache() {
  const r = await fetch('/api/requirements');
  if (!r.ok) return;
  const data = await r.json();
  S.reqs = data.tipos || [];
  S.reqsTimestamp = data.timestamp || null;
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderLogin(msg = '') {
  document.getElementById('hUser').style.display = 'none';
  document.getElementById('app').innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-logo">Control<em>Bun</em></div>
        <p class="login-sub">Ingresá con tu cuenta de controldocumentario.com</p>
        ${msg ? `<div class="login-err">${msg}</div>` : ''}
        <form id="loginForm" onsubmit="doLogin(event)">
          <div class="field">
            <label class="field-label">Usuario (email)</label>
            <input class="field-input" type="email" id="loginUser" placeholder="usuario@empresa.com" required autocomplete="username">
          </div>
          <div class="field">
            <label class="field-label">Contraseña</label>
            <input class="field-input" type="password" id="loginPass" placeholder="••••••••" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-dark login-btn" id="loginBtn">Ingresar</button>
        </form>
      </div>
    </div>`;
  setTimeout(() => document.getElementById('loginUser')?.focus(), 50);
}

async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const cdUser = document.getElementById('loginUser').value.trim();
  const cdPass = document.getElementById('loginPass').value;
  btn.disabled = true;
  btn.textContent = 'Verificando…';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cdUser, cdPass }),
    });
    if (!r.ok) {
      const data = await r.json().catch(() => ({}));
      renderLogin(data.error || 'Credenciales incorrectas');
      return;
    }
    const { nombre } = await r.json();
    S.user = { nombre };
    showHeader();
    await loadMapeos();
    loadReqsCache().catch(() => {});
  } catch {
    renderLogin('Error de conexión. Intentá de nuevo.');
  }
}

const searchSvg = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6.5" cy="6.5" r="4"/><path d="M10.5 10.5l3 3"/></svg>`;
const tableIcon = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="3" width="14" height="2.5" rx="1"/><rect x="1" y="7" width="14" height="2.5" rx="1"/><rect x="1" y="11" width="14" height="2.5" rx="1"/></svg>`;
const gridIcon  = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>`;

function setView(v) {
  S.viewType = v;
  localStorage.setItem('viewType', v);
  render();
}

function filterSearch(q) {
  S.searchQuery = q;
  render();
}

function render() {
  const q = S.searchQuery.toLowerCase();
  const mapeos = q ? S.mapeos.filter(m => m.nombre.toLowerCase().includes(q)) : S.mapeos;

  const content = mapeos.length
    ? (S.viewType === 'table' ? renderTable(mapeos) : `<div class="grid">${mapeos.map((m,i) => card(m,i)).join('')}</div>`)
    : `<div style="text-align:center;padding:72px 24px"><span style="font-size:52px;display:block;margin-bottom:16px;opacity:.25">📁</span><p style="font-family:'Crimson Pro',serif;font-size:22px;color:var(--text-2);margin-bottom:6px">${q ? 'Sin resultados' : 'Sin mapeos todavía'}</p><p style="font-size:13px;color:var(--text-3)">${q ? `No hay mapeos que coincidan con "${esc(q)}"` : 'Hacé click en <strong>Nuevo mapeo</strong> para empezar.'}</p></div>`;

  document.getElementById('app').innerHTML = `
    <div class="ph">
      <div class="ph-left">
        <h1>Mis mapeos</h1>
        ${S.mapeos.length ? `<p style="font-size:13px;color:var(--text-3)">${S.mapeos.length} tipo${S.mapeos.length!==1?'s':''} aprendido${S.mapeos.length!==1?'s':''}</p>` : ''}
      </div>
      <div class="ph-right">
        <button class="btn btn-dark" onclick="openEditor()">${IC.plus} Nuevo mapeo</button>
      </div>
    </div>
    <div class="toolbar">
      <div class="search-wrap">
        ${searchSvg}
        <input class="toolbar-search" type="text" placeholder="Buscar mapeo…" value="${esc(S.searchQuery)}" oninput="filterSearch(this.value)" autocomplete="off">
      </div>
      <div style="flex:1"></div>
      <div class="view-toggle">
        <button class="view-btn ${S.viewType==='table'?'active':''}" onclick="setView('table')" title="Vista tabla">${tableIcon}</button>
        <button class="view-btn ${S.viewType==='cards'?'active':''}" onclick="setView('cards')" title="Vista tarjetas">${gridIcon}</button>
      </div>
    </div>
    ${content}`;
}

function renderTable(mapeos) {
  const editIcon = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 2l3 3-8 8H3v-3l8-8z"/></svg>`;
  const rows = mapeos.map((m, i) => {
    const delay = Math.min(i * 30, 300);
    const count = Math.min(m.paginas, 4);
    const thumbs = Array.from({ length: count }, (_, j) => {
      const src = `/api/mapeo/${encodeURIComponent(m.nombre)}/img/${j}`;
      return `<div class="td-thumb-inner" onclick="openLb('${src}')" title="Pág ${j+1}">
        <img src="${src}" alt="" loading="lazy" onerror="this.parentElement.style.background='var(--bg)'">
      </div>`;
    }).join('');

    return `<tr style="animation-delay:${delay}ms">
      <td class="td-thumbs">${thumbs}</td>
      <td>
        <div class="td-nombre">${esc(m.nombre)}</div>
        <div class="td-meta">${m.paginas} página${m.paginas!==1?'s':''} de referencia</div>
      </td>
      <td class="td-actions">
        <button class="btn btn-ghost btn-sm" data-nombre="${esc(m.nombre)}" onclick="openModify(this.dataset.nombre)">${editIcon} Modificar</button>
        <button class="btn btn-danger btn-sm" data-nombre="${esc(m.nombre)}" onclick="openDel(this.dataset.nombre)">${IC.trash} Eliminar</button>
      </td>
    </tr>`;
  }).join('');

  return `<div class="table-wrap">
    <table class="mapeos-table">
      <thead><tr>
        <th style="width:1px">Páginas</th>
        <th>Tipo de documento</th>
        <th style="width:160px;text-align:right;padding-right:16px">Acciones</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function card(m, i) {
  const delay = Math.min(i * 45, 280);
  let imgs = '';
  for (let j = 0; j < Math.min(m.paginas, 2); j++) {
    imgs += `<img class="card-img" src="/api/mapeo/${encodeURIComponent(m.nombre)}/img/${j}" alt="Pág ${j+1}" loading="lazy" onclick="openLb(this.src)">`;
  }
  if (!imgs) imgs = '<div class="card-no-img">Sin imagen</div>';

  const editIcon = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 2l3 3-8 8H3v-3l8-8z"/></svg>`;
  return `<div class="card" style="animation-delay:${delay}ms">
    <div class="card-imgs">${imgs}</div>
    <div class="card-body">
      <div class="card-name">${esc(m.nombre)}</div>
      <div class="card-meta">${m.paginas} página${m.paginas!==1?'s':''} de referencia</div>
      <div class="card-actions">
        <button class="btn btn-ghost" data-nombre="${esc(m.nombre)}" onclick="openModify(this.dataset.nombre)">${editIcon} Modificar</button>
        <button class="btn btn-danger" data-nombre="${esc(m.nombre)}" onclick="openDel(this.dataset.nombre)">${IC.trash} Eliminar</button>
      </div>
    </div>
  </div>`;
}

// ── Lightbox ──────────────────────────────────────────────────────────────────
function openLb(src) {
  document.getElementById('lbImg').src = src;
  document.getElementById('lb').style.display = 'flex';
}
function closeLb() { document.getElementById('lb').style.display = 'none'; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeLb(); closeModal(); } });

// ── Modal helpers ─────────────────────────────────────────────────────────────
let _modal = null;

function openModal(html) {
  closeModal();
  _modal = document.createElement('div');
  _modal.className = 'overlay';
  _modal.innerHTML = html;
  _modal.addEventListener('click', e => { if (e.target === _modal) closeModal(); });
  document.body.appendChild(_modal);
}

function closeModal() {
  if (_modal) { _modal.remove(); _modal = null; }
}

// ── Delete ────────────────────────────────────────────────────────────────────
let _delNombre = null;

function openDel(nombre) {
  _delNombre = nombre;
  openModal(`<div class="modal">
    <div class="confirm-body">
      <span class="confirm-icon">🗑️</span>
      <p class="confirm-text">¿Eliminar el mapeo<br><span class="confirm-name">"${esc(nombre)}"</span>?<br><small style="color:var(--text-3)">Esta acción no se puede deshacer.</small></p>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" onclick="doDel()">${IC.trash} Eliminar</button>
    </div>
  </div>`);
}

async function doDel() {
  const nombre = _delNombre;
  if (!nombre) return;
  try {
    await apiFetch('DELETE', `/api/mapeo/${encodeURIComponent(nombre)}`);
    S.mapeos = S.mapeos.filter(m => m.nombre !== nombre);
    _delNombre = null;
    closeModal();
    render();
    toast(`"${nombre}" eliminado`);
  } catch { toast('Error al eliminar', 'err'); }
}

// ── Modify (opens editor pre-loaded with existing mapeo) ─────────────────────
async function openModify(nombre) {
  const app = document.getElementById('app');
  app.style.maxWidth = 'none';
  app.style.padding = '0';
  app.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:calc(100vh - 60px)"><div class="loading"><div class="spin"></div><span>Cargando mapeo…</span></div></div>`;

  try {
    const r = await apiFetch('GET', `/api/mapeo/${encodeURIComponent(nombre)}/pages`);
    if (!r.ok) throw new Error();
    const { paginas } = await r.json();

    E = {
      paginasData: paginas,
      pagSinAsignar: new Set(),
      seleccion: new Set(),
      grupos: [{ id: 0, nombre, color: GROUP_COLORS[0], paginas }],
      nextGroupId: 1,
      viewMode: 4,
      modifyNombre: nombre,
      mapeosExistentes: new Set(S.mapeos.map(m => m.nombre.toLowerCase())),
    };
    renderEditor();
  } catch {
    app.style.maxWidth = '';
    app.style.padding = '';
    render();
    toast('Error cargando el mapeo', 'err');
  }
}

// ── Replace (modal — kept for internal use via dropZone) ──────────────────────
let _rState = { nombre: null, paginasData: [], sel: [] };

function dropZone() {
  return `<div class="drop-zone" id="dz">
    <input type="file" accept="application/pdf" onchange="handleFile(event)">
    <span class="drop-icon">📄</span>
    <p class="drop-text">Subir PDF de referencia</p>
    <p class="drop-hint">Arrastrá el archivo o hacé click para elegirlo</p>
  </div>`;
}

function bindDrop() {
  setTimeout(() => {
    const dz = document.getElementById('dz');
    if (!dz) return;
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('over'));
    dz.addEventListener('drop', e => {
      e.preventDefault(); dz.classList.remove('over');
      const f = e.dataTransfer.files[0];
      if (f?.type === 'application/pdf') handleFile({ target: { files: [f] } });
    });
  }, 0);
}

async function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const nombre = _rState.nombre;
  const body = document.getElementById('rBody');
  body.innerHTML = pdfLoaderHtml('rl');
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  try {
    pdfLoaderStep('rl', 1);
    const buf = await file.arrayBuffer();
    pdfLoaderStep('rl', 2);
    const r = await apiFetch('POST', `/api/mapeo/${encodeURIComponent(nombre)}/upload`, buf);
    pdfLoaderStep('rl', 3);
    if (!r.ok) throw new Error(await r.text());
    const { paginas } = await r.json();
    _rState.paginasData = paginas;
    _rState.sel = [];

    body.innerHTML = `
      <p class="sel-label">${paginas.length} página${paginas.length>1?'s':''} — seleccioná las de referencia</p>
      <div class="pages-grid" id="pgrid">
        ${paginas.map((p, i) => `
          <div class="page-th" id="pt${i}" onclick="togglePage(${i})">
            <img src="data:image/jpeg;base64,${p.imagen}" alt="Pág ${p.num}" loading="lazy">
            <span class="page-num">Pág ${p.num}</span>
            <span class="page-check">${IC.check}</span>
          </div>`).join('')}
      </div>`;

    if (paginas.length === 1) togglePage(0);
    document.getElementById('rSave').style.display = 'inline-flex';
  } catch(err) {
    body.innerHTML = dropZone();
    bindDrop();
    toast(`Error: ${err.message}`, 'err');
  }
}

function togglePage(i) {
  const el = document.getElementById(`pt${i}`);
  if (!el) return;
  const pos = _rState.sel.indexOf(i);
  if (pos === -1) { _rState.sel.push(i); el.classList.add('sel'); }
  else { _rState.sel.splice(pos, 1); el.classList.remove('sel'); }
  const btn = document.getElementById('rSave');
  if (btn) btn.disabled = _rState.sel.length === 0;
}

async function doReplace() {
  if (!_rState.sel.length) { toast('Seleccioná al menos una página', 'err'); return; }
  const btn = document.getElementById('rSave');
  if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }

  const paginas = [..._rState.sel]
    .sort((a, b) => a - b)
    .map(i => ({ num: _rState.paginasData[i].num, imagen: _rState.paginasData[i].imagen, texto: '' }));

  try {
    const r = await apiFetch('PATCH', `/api/mapeo/${encodeURIComponent(_rState.nombre)}`, { paginas });
    if (!r.ok) throw new Error('Error guardando');
    const m = S.mapeos.find(m => m.nombre === _rState.nombre);
    if (m) m.paginas = paginas.length;
    closeModal();
    render();
    toast(`Referencia de "${_rState.nombre}" actualizada`);
  } catch {
    toast('Error guardando los cambios', 'err');
    if (btn) { btn.disabled = false; btn.innerHTML = `${IC.upload} Guardar`; }
  }
}

// ════════════════════════════════════════════════════════════════════════════
// EDITOR
// ════════════════════════════════════════════════════════════════════════════

function openEditor() {
  E = {
    paginasData: [],
    pagSinAsignar: new Set(),
    seleccion: new Set(),
    grupos: [],
    nextGroupId: 0,
    viewMode: 4,
    mapeosExistentes: new Set(S.mapeos.map(m => m.nombre.toLowerCase())),
  };
  renderEditor();
}

function closeEditor() {
  E = null;
  const app = document.getElementById('app');
  app.style.maxWidth = '';
  app.style.padding = '';
  render();
}

function renderEditor() {
  // Replace main tag content but keep header
  const app = document.getElementById('app');
  app.style.maxWidth = 'none';
  app.style.padding = '0';

  const reqIconSvg = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="2"/><path d="M5 6h6M5 9h4"/></svg>`;
  const reqsBtn = `<div class="reqs-panel">
    <div class="reqs-panel-icon">${reqIconSvg}</div>
    <div class="reqs-panel-text">
      <div class="reqs-panel-title">Requeridos de Control Documentario</div>
      <div class="reqs-panel-sub">${S.reqs.length ? `<strong style="color:var(--text-2)">${S.reqs.length}</strong> tipos cargados${S.reqsTimestamp ? ' · ' + fmtDate(S.reqsTimestamp) : ''}` : 'Sin datos — actualizá para obtener la lista'}</div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="refreshReqs()" id="refreshBtn">${IC.refresh} Actualizar</button>
  </div>`;

  app.innerHTML = `
    <div class="editor-wrap">
      <div class="editor-bar">
        <div class="editor-bar-left">
          <button class="btn btn-ghost" onclick="closeEditor()">${IC.back} Volver</button>
          <span class="editor-title">${E.modifyNombre ? 'Modificar: '+esc(E.modifyNombre) : 'Nuevo mapeo'}</span>
          <span style="width:1px;height:22px;background:var(--border);display:inline-block;margin:0 4px"></span>
          <div id="edActions" style="display:flex;align-items:center;gap:8px">${renderEditorActions()}</div>
        </div>
        <div class="editor-bar-right">
          ${reqsBtn}
        </div>
      </div>
      <div class="editor-body">
        <div class="editor-left" id="edLeft">${renderEditorLeft()}</div>
        <div class="editor-right" id="edRight">${renderEditorRight()}</div>
      </div>
    </div>`;
  setTimeout(() => bindEditorDrop(), 0);
}

function renderEditorLeft() {
  if (!E.paginasData.length) {
    return `<div class="editor-upload">
      <div class="editor-drop" id="edDrop">
        <input type="file" accept="application/pdf" id="edFile" onchange="handleEditorFile(event)">
        <span class="editor-drop-icon">📄</span>
        <p class="editor-drop-text">Subir PDF</p>
        <p class="editor-drop-hint">Arrastrá el archivo o hacé click para elegirlo</p>
      </div>
    </div>`;
  }

  const total = E.paginasData.length;
  const sinAsignar = E.pagSinAsignar.size;
  const selCount = E.seleccion.size;

  const makeThumbnail = (p, small) => {
    const num = p.num;
    const assigned = !E.pagSinAsignar.has(num);
    const sel = E.seleccion.has(num);
    const grupo = assigned ? E.grupos.find(g => g.paginas.some(pg => pg.num === num)) : null;
    const color = grupo ? grupo.color : '';
    let classes = 'ep';
    if (sel) classes += ' ep-sel';
    if (assigned) classes += ' ep-assigned';
    const badge = grupo
      ? `<div class="ep-badge" style="background:${color}cc">${esc(grupo.nombre)}</div>`
      : '';
    return `<div class="${classes}" id="ep${num}" onclick="toggleEditorPage(${num})">
      <img src="data:image/jpeg;base64,${p.imagen}" alt="Pág ${num}" loading="lazy">
      <span class="ep-num">${num}</span>
      ${badge}
      ${!small ? `<span class="ep-check">${IC.check}</span>` : ''}
      <button class="ep-eye" onclick="event.stopPropagation();openLb('data:image/jpeg;base64,${p.imagen}')" title="Ver en grande">${IC.eye}</button>
    </div>`;
  };

  const sinAsignarPages = E.paginasData.filter(p => E.pagSinAsignar.has(p.num));
  const asignadasPages  = E.paginasData.filter(p => !E.pagSinAsignar.has(p.num));

  const assignedSection = asignadasPages.length ? `
    <div class="editor-section-label">Asignadas (${asignadasPages.length})</div>
    <div class="editor-pages-assigned">${asignadasPages.map(p => makeThumbnail(p, true)).join('')}</div>` : '';

  return `
    <div class="editor-pages-hd">
      <span class="editor-pages-label">${sinAsignarPages.length} sin asignar</span>
      ${selCount > 0 ? `<span class="editor-sel-count">${selCount} seleccionada${selCount!==1?'s':''}</span>` : ''}
    </div>
    <div class="editor-pages" style="grid-template-columns:repeat(${E.viewMode},1fr)">${sinAsignarPages.map(p => makeThumbnail(p, false)).join('')}</div>
    ${assignedSection}`;
}

function renderEditorRight() {
  const hasPdf = E.paginasData.length > 0;
  const canSave = E.grupos.length > 0;

  const groupCards = E.grupos.length
    ? E.grupos.map(g => `
      <div class="group-card">
        <div class="group-card-hd">
          <span class="group-dot" style="background:${g.color}"></span>
          <span class="group-name" title="${esc(g.nombre)}">${esc(g.nombre)}</span>
          <button class="group-rm" onclick="removeGroup(${g.id})" title="Quitar">${IC.x}</button>
        </div>
        <div class="group-thumbs">
          ${g.paginas.slice(0,6).map(p => `
            <div class="group-thumb" onclick="openLb('data:image/jpeg;base64,${p.imagen}')" title="Pág ${p.num}">
              <img src="data:image/jpeg;base64,${p.imagen}" alt="${p.num}">
            </div>`).join('')}
          ${g.paginas.length > 6 ? `<div class="group-thumb" style="display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-3);background:var(--bg);cursor:default">+${g.paginas.length-6}</div>` : ''}
        </div>
        <div class="group-pages-count">${g.paginas.length} hoja${g.paginas.length!==1?'s':''}</div>
      </div>`).join('')
    : `<div class="sidebar-empty">${hasPdf ? 'Seleccioná páginas y asignales un tipo de requerimiento.' : 'Subí un PDF para empezar.'}</div>`;

  const saveLabel = E.grupos.length === 1
    ? `Guardar 1 mapeo`
    : `Guardar ${E.grupos.length} mapeos`;

  return `
    <div class="sidebar-hd">
      <div class="sidebar-title">Grupos creados</div>
      <div class="sidebar-sub">${E.grupos.length} grupo${E.grupos.length!==1?'s':''}</div>
    </div>
    <div class="sidebar-groups">${groupCards}</div>
    <div class="sidebar-ft">
      <button class="btn btn-dark btn-lg" style="width:100%;justify-content:center"
        onclick="saveAllGroups()" ${canSave?'':'disabled'}>
        ${IC.save} ${saveLabel}
      </button>
    </div>`;
}

function renderEditorActions() {
  if (!E || !E.paginasData.length) return '';
  const selCount = E.seleccion.size;
  const canAssign = selCount > 0 && S.reqs.length > 0;
  const noReqs = selCount > 0 && !S.reqs.length;
  const is2col = E.viewMode === 2;
  return `
    <button class="btn btn-accent" onclick="openReqPicker()" ${canAssign?'':'disabled'}>
      ${IC.plus} Asignar${selCount > 0 ? ' '+selCount+' página'+(selCount!==1?'s':'') : ' páginas'}
    </button>
    ${noReqs ? `<span style="font-size:12px;color:var(--text-3)">Cargá los reqs →</span>` : ''}
    <button class="btn btn-ghost btn-sm" onclick="editorNewPdf()">Cambiar PDF</button>
    <button class="btn btn-ghost btn-sm" onclick="toggleViewMode()" title="${is2col ? 'Vista compacta' : 'Vista grande'}">
      ${is2col ? IC.grid4 : IC.grid2}
    </button>`;
}

function toggleViewMode() {
  E.viewMode = E.viewMode === 2 ? 4 : 2;
  refreshEditorUI();
}

function refreshEditorUI() {
  const left = document.getElementById('edLeft');
  const right = document.getElementById('edRight');
  const actions = document.getElementById('edActions');
  if (left) left.innerHTML = renderEditorLeft();
  if (right) right.innerHTML = renderEditorRight();
  if (actions) actions.innerHTML = renderEditorActions();
}

function toggleEditorPage(num) {
  if (!E || !E.pagSinAsignar.has(num)) return;
  if (E.seleccion.has(num)) {
    E.seleccion.delete(num);
  } else {
    E.seleccion.add(num);
  }
  refreshEditorUI();
}

function editorNewPdf() {
  const tieneGrupos = E.grupos.length > 0;
  const msg = tieneGrupos
    ? `¿Cambiar el PDF? Se perderán los ${E.grupos.length} grupo${E.grupos.length!==1?'s':''} creados.`
    : '¿Cambiar el PDF?';
  openModal(`<div class="modal">
    <div class="confirm-body">
      <span class="confirm-icon">📄</span>
      <p class="confirm-text">${msg}<br><small style="color:var(--text-3)">Esta acción no se puede deshacer.</small></p>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-dark" onclick="confirmNewPdf()">Cambiar PDF</button>
    </div>
  </div>`);
}

function confirmNewPdf() {
  E.paginasData = [];
  E.pagSinAsignar = new Set();
  E.seleccion = new Set();
  E.grupos = [];
  closeModal();
  refreshEditorUI();
  setTimeout(() => bindEditorDrop(), 0);
}

async function handleEditorFile(e) {
  const file = e.target.files[0];
  if (!file) return;

  const left = document.getElementById('edLeft');
  left.innerHTML = `<div class="editor-upload">${pdfLoaderHtml('el')}</div>`;
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  try {
    pdfLoaderStep('el', 1);
    const buf = await file.arrayBuffer();
    pdfLoaderStep('el', 2);
    const r = await apiFetch('POST', '/api/pdf/render', buf);
    pdfLoaderStep('el', 3);
    if (!r.ok) throw new Error(await r.text());
    const { paginas } = await r.json();
    E.paginasData = paginas;
    E.pagSinAsignar = new Set(paginas.map(p => p.num));
    E.seleccion = new Set();
    refreshEditorUI();
  } catch(err) {
    left.innerHTML = renderEditorLeft();
    setTimeout(() => bindEditorDrop(), 0);
    toast(`Error procesando PDF: ${err.message}`, 'err');
  }
}

function bindEditorDrop() {
  const drop = document.getElementById('edDrop');
  if (!drop) return;
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => {
    e.preventDefault(); drop.classList.remove('over');
    const f = e.dataTransfer.files[0];
    if (f?.type === 'application/pdf') handleEditorFile({ target: { files: [f] } });
  });
}

// ── Requirements picker ────────────────────────────────────────────────────────
let _pickerSel = new Set();

function openReqPicker() {
  if (!E.seleccion.size) return;
  _pickerSel = new Set();
  const usados = new Set(E.grupos.map(g => g.nombre.toLowerCase()));

  openModal(`<div class="modal modal-lg" style="max-height:88vh">
    <div class="modal-hd">
      <div>
        <div class="modal-title">Elegir requerimientos</div>
        <div class="modal-sub">${E.seleccion.size} página${E.seleccion.size!==1?'s':''} · seleccioná uno o más</div>
      </div>
      <button class="modal-x" onclick="closeModal()">${IC.x}</button>
    </div>
    <div class="modal-body" style="padding-bottom:8px">
      <input class="req-search" type="text" id="reqSearch" placeholder="Buscar tipo de requerimiento…" oninput="filterReqs()" autocomplete="off">
      <div class="req-list" id="reqList">${buildReqList(S.reqs, usados, '')}</div>
    </div>
    <div class="req-confirm" id="reqConfirm">
      <span class="req-confirm-label" id="reqConfirmLabel">Ninguno seleccionado</span>
      <button class="btn btn-accent" id="reqConfirmBtn" onclick="confirmReqPicker()" disabled>Asignar</button>
    </div>
  </div>`);
  setTimeout(() => document.getElementById('reqSearch')?.focus(), 50);
}

function buildReqList(reqs, usados, q) {
  const filtered = q
    ? reqs.filter(r => r.toLowerCase().includes(q.toLowerCase()))
    : reqs;

  if (!filtered.length) return `<div class="req-none">Sin resultados para "${esc(q)}"</div>`;

  const checkSvg = `<svg viewBox="0 0 10 10"><path d="M1.5 5l2.5 2.5 4.5-5"/></svg>`;
  return filtered.map(r => {
    const isUsed = usados.has(r.toLowerCase());
    const isPicked = _pickerSel.has(r);
    const isExisting = E.mapeosExistentes.has(r.toLowerCase());
    const badge = isExisting && !isUsed ? `<span class="req-badge">Sobreescribirá</span>` : '';
    return `<div class="req-item ${isUsed?'used':''} ${isPicked?'picked':''}" data-req="${esc(r)}" onclick="${isUsed?'':'togglePickerReq(this)'}">
      <span class="req-cb">${checkSvg}</span>
      <span class="req-label">${esc(r)}</span>
      ${badge}
    </div>`;
  }).join('');
}

function togglePickerReq(el) {
  const r = el.dataset.req;
  if (_pickerSel.has(r)) {
    _pickerSel.delete(r);
    el.classList.remove('picked');
  } else {
    _pickerSel.add(r);
    el.classList.add('picked');
  }
  const n = _pickerSel.size;
  const lbl = document.getElementById('reqConfirmLabel');
  const btn = document.getElementById('reqConfirmBtn');
  if (lbl) lbl.textContent = n === 0 ? 'Ninguno seleccionado' : `${n} requerimiento${n!==1?'s':''} seleccionado${n!==1?'s':''}`;
  if (btn) btn.disabled = n === 0;
}

function filterReqs() {
  const q = document.getElementById('reqSearch')?.value || '';
  const usados = new Set(E.grupos.map(g => g.nombre.toLowerCase()));
  const list = document.getElementById('reqList');
  if (list) list.innerHTML = buildReqList(S.reqs, usados, q);
}

function confirmReqPicker() {
  if (!_pickerSel.size) return;
  const nombres = [..._pickerSel];
  createGroups(nombres);
}

function createGroups(nombres) {
  const paginasNums = [...E.seleccion].sort((a, b) => a - b);
  const paginas = paginasNums.map(num => E.paginasData.find(p => p.num === num));

  for (const nombre of nombres) {
    const colorIdx = E.grupos.length % GROUP_COLORS.length;
    E.grupos.push({ id: E.nextGroupId++, nombre, color: GROUP_COLORS[colorIdx], paginas });
  }
  paginasNums.forEach(n => E.pagSinAsignar.delete(n));
  E.seleccion.clear();

  closeModal();
  refreshEditorUI();
  const n = nombres.length;
  toast(`${n} grupo${n!==1?'s':''} creado${n!==1?'s':''} (${paginas.length} pág.)`);
}

function removeGroup(id) {
  const g = E.grupos.find(gr => gr.id === id);
  if (!g) return;
  g.paginas.forEach(p => E.pagSinAsignar.add(p.num));
  E.grupos = E.grupos.filter(gr => gr.id !== id);
  refreshEditorUI();
}

// ── Save all groups ────────────────────────────────────────────────────────────
async function saveAllGroups() {
  if (!E.grupos.length) return;
  const btn = document.querySelector('.sidebar-ft .btn');
  if (btn) { btn.disabled = true; btn.innerHTML = `<div class="spin spin-sm"></div> Guardando…`; }

  let ok = 0, err = 0;
  for (const g of E.grupos) {
    const paginas = g.paginas.map(p => ({ num: p.num, imagen: p.imagen, texto: '' }));
    try {
      const r = await apiFetch('PATCH', `/api/mapeo/${encodeURIComponent(g.nombre)}`, { paginas });
      if (!r.ok) throw new Error();
      ok++;
    } catch {
      err++;
      toast(`Error guardando "${g.nombre}"`, 'err');
    }
  }

  if (ok > 0) {
    toast(`${ok} mapeo${ok!==1?'s':''} guardado${ok!==1?'s':''}`);
    await loadMapeos();
    closeEditor();
  } else if (btn) {
    btn.disabled = false;
    btn.innerHTML = `${IC.save} Reintentar`;
  }
}

// ── Refresh requirements ──────────────────────────────────────────────────────
async function refreshReqs() {
  const btn = document.getElementById('refreshBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = `<div class="spin spin-sm"></div> Cargando…`; }

  try {
    const r = await apiFetch('POST', '/api/requirements/refresh');
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      throw new Error(d.error || 'Error');
    }
    const data = await r.json();
    S.reqs = data.tipos || [];
    S.reqsTimestamp = data.timestamp || null;
    toast(`${S.reqs.length} tipos de requerimiento cargados`);
    if (E) refreshEditorUI(); else render();
  } catch(err) {
    toast(`Error cargando reqs: ${err.message}`, 'err');
    if (btn) { btn.disabled = false; btn.innerHTML = `${IC.refresh} Reintentar`; }
  }
}

// ── Boot ──────────────────────────────────────────────────────────────────────
init();
</script>
